[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldfront-utils"
version = "0.3.0"
requires-python = ">=3.10"
authors = [
    { name = "Chris Barnett" }
]
description = "Coldfront Utilities"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["high-performance-computing", "resource-allocation"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 5.2',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]
dependencies = [
    "coldfront>=1.1.8,<2",
]

[project.urls]
"Source Code" = "https://github.com/Tufts-Technology-Services/coldfront-utils"

[project.optional-dependencies]
ssh = [
    "fabric<=3.0.0",
]
# For coldfront_utils.util.ad_search. Its base class, coldfront's ldap_user_search plugin, needs
# both python-ldap (through django-auth-ldap) and ldap3; coldfront's ldap extra brings the two.
ad = [
    "coldfront[ldap]>=1.1.8,<2",
]

[dependency-groups]
dev = [
    "coldfront-utils[ad]",
    "pytest-django>=4.11.1",
    # coldfront.core.test_helpers.factories needs it, but coldfront does not depend on it.
    "factory-boy>=3.3.3",
    "ruff>=0.11.4",
    "pre-commit>=4.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["coldfront_utils"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"  # the oldest Python in requires-python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S308", "S113"]

[tool.ruff.lint.isort]
# coldfront's imports get a section of their own, between third-party and this package's
sections = { "coldfront-main" = ["coldfront"] }
section-order = ["future", "standard-library", "third-party", "coldfront-main", "first-party", "local-folder"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
# The tests live outside the package, unlike the plugins' tests: several of the helpers import
# coldfront's models, which can't happen before the settings module has loaded.
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
